---
# 1. REDIS CACHE
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-redis
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-redis
  template:
    metadata:
      labels:
        app: immich-redis
    spec:
      containers:
        - name: redis
          image: valkey/valkey:8-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: immich-redis
  namespace: default
spec:
  selector:
    app: immich-redis
  ports:
    - port: 6379
      targetPort: 6379

---
# 2. POSTGRESQL DATABASE WITH VECTOR SUPPORT
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-postgres
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-postgres
  template:
    metadata:
      labels:
        app: immich-postgres
    spec:
      containers:
        - name: postgres
          image: ghcr.io/immich-app/postgres:16-vectorchord0.3.0-pgvectors0.3.0
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "immichpass"
            - name: POSTGRES_DB
              value: "immich"
          ports:
            - containerPort: 5432
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-storage
      volumes:
        - name: postgres-storage
          hostPath:
            path: /srv/immich/postgres
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: immich-postgres
  namespace: default
spec:
  selector:
    app: immich-postgres
  ports:
    - port: 5432
      targetPort: 5432

---
# 3. MACHINE LEARNING ENGINE
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-machine-learning
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-machine-learning
  template:
    metadata:
      labels:
        app: immich-machine-learning
    spec:
      containers:
        - name: machine-learning
          image: ghcr.io/immich-app/immich-machine-learning:release
          env:
            - name: NODE_ENV
              value: "production"
          ports:
            - containerPort: 3003
---
apiVersion: v1
kind: Service
metadata:
  name: immich-machine-learning
  namespace: default
spec:
  selector:
    app: immich-machine-learning
  ports:
    - port: 3003
      targetPort: 3003

---
# 4. MAIN IMMICH SERVER & WEB INTERFACE
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:release
          env:
            - name: DB_HOSTNAME
              value: "immich-postgres"
            - name: DB_USERNAME
              value: "postgres"
            - name: DB_PASSWORD
              value: "immichpass"
            - name: DB_DATABASE_NAME
              value: "immich"
            - name: REDIS_HOSTNAME
              value: "immich-redis"
            - name: IMMICH_MACHINE_LEARNING_URL
              value: "http://immich-machine-learning:3003"
          ports:
            - containerPort: 2283
          volumeMounts:
            - mountPath: /usr/src/app/upload
              name: upload-storage
      volumes:
        - name: upload-storage
          hostPath:
            path: /srv/immich/upload
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: immich-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: immich-server
  ports:
    - port: 2283
      targetPort: 2283
      nodePort: 32283
