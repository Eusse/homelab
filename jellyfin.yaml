apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  labels:
    app: jellyfin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:latest
          ports:
            - containerPort: 8096
              name: http
          volumeMounts:
            - mountPath: /config
              name: jellyfin-config
            - mountPath: /data/tvshows
              name: media-tvshows
            - mountPath: /data/movies
              name: media-movies
      volumes:
        - name: jellyfin-config
          hostPath:
            path: /srv/jellyfin/config
            type: Directory
        - name: media-tvshows
          hostPath:
            path: /srv/media/tv
            type: Directory
        - name: media-movies
          hostPath:
            path: /srv/media/movies
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-service
spec:
  type: NodePort
  selector:
    app: jellyfin
  ports:
    - port: 8096
      targetPort: 8096
      nodePort: 32096
