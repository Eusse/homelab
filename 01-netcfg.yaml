# sudo nano /etc/netplan/01-netcfg.yaml
# chmod 600 this file
network:
  version: 2
  wifis:
    wlo1:
      dhcp4: false
      addresses:
        - 192.168.78.166/24
      routes:
        - to: default
          via: 192.168.78.1
      nameservers:
        addresses: [192.168.78.1, 1.1.1.1]
      access-points:
        "SSID":
          password: "PASSWORD"
