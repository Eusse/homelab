{{- if .Values.infisicalServer.enabled }}
{{- /*
The infisical-standalone dependency expects these to already exist in a
Secret named after its `infisical.kubeSecretRef` value (default
"infisical-secrets") - it does not create this itself. ENCRYPTION_KEY and
AUTH_SECRET must stay stable across upgrades (they protect data already
encrypted in Infisical's database), so reuse whatever is already in the
cluster instead of regenerating on every `helm upgrade`.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "infisical-secrets" }}
{{- $encryptionKey := "" }}
{{- $authSecret := "" }}
{{- if $existing }}
{{- $encryptionKey = index $existing.data "ENCRYPTION_KEY" | b64dec }}
{{- $authSecret = index $existing.data "AUTH_SECRET" | b64dec }}
{{- else }}
{{- $encryptionKey = uuidv4 | sha256sum | trunc 32 }}
{{- $authSecret = randAlphaNum 32 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: infisical-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab.labels" (dict "name" "infisical" "Release" .Release) | nindent 4 }}
type: Opaque
stringData:
  ENCRYPTION_KEY: {{ $encryptionKey | quote }}
  AUTH_SECRET: {{ $authSecret | quote }}
  SITE_URL: {{ .Values.infisical.hostAPI | quote }}
{{- end }}
