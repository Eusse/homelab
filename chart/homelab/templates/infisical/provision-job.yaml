{{- if .Values.infisicalServer.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: infisical-provision
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "14"
    # No hook-succeeded here: it would delete this the instant Helm sees it
    # created, racing ahead of the Job below actually starting and mounting
    # its ServiceAccount token - before-hook-creation alone still replaces
    # it cleanly on the next install/upgrade.
    helm.sh/hook-delete-policy: before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: infisical-provision
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "14"
    # No hook-succeeded here: it would delete this the instant Helm sees it
    # created, racing ahead of the Job below actually starting and mounting
    # its ServiceAccount token - before-hook-creation alone still replaces
    # it cleanly on the next install/upgrade.
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["secrets.infisical.com"]
    resources: ["infisicalsecrets"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: infisical-provision
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "14"
    # No hook-succeeded here: it would delete this the instant Helm sees it
    # created, racing ahead of the Job below actually starting and mounting
    # its ServiceAccount token - before-hook-creation alone still replaces
    # it cleanly on the next install/upgrade.
    helm.sh/hook-delete-policy: before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: infisical-provision
subjects:
  - kind: ServiceAccount
    name: infisical-provision
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: infisical-provision-script
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "14"
    # No hook-succeeded: the Job mounts this as a volume at pod start -
    # hook-succeeded would delete it as soon as it's created, racing ahead
    # of that pod actually starting.
    helm.sh/hook-delete-policy: before-hook-creation
data:
  provision.py: |
    import base64
    import os
    import sys
    import time
    import requests

    NS = os.environ["NS"]
    API = os.environ["API"]
    ENV_SLUG = os.environ["ENV_SLUG"]
    RESYNC_INTERVAL = int(os.environ["RESYNC_INTERVAL"])
    ADMIN_EMAIL = os.environ["INFISICAL_ADMIN_EMAIL"]
    ADMIN_PASSWORD = os.environ["INFISICAL_ADMIN_PASSWORD"]

    K8S_API = "https://kubernetes.default.svc"
    SA_DIR = "/var/run/secrets/kubernetes.io/serviceaccount"
    with open(f"{SA_DIR}/token") as f:
        K8S_TOKEN = f.read().strip()
    K8S_CA = f"{SA_DIR}/ca.crt"
    K8S_HEADERS = {"Authorization": f"Bearer {K8S_TOKEN}", "Content-Type": "application/json"}

    def k8s_get(url):
        resp = requests.get(url, headers=K8S_HEADERS, verify=K8S_CA, timeout=15)
        if resp.status_code == 404:
            return None
        resp.raise_for_status()
        return resp.json()

    def k8s_apply_secret(name, string_data):
        url = f"{K8S_API}/api/v1/namespaces/{NS}/secrets/{name}"
        data = {k: base64.b64encode(v.encode()).decode() for k, v in string_data.items()}
        if k8s_get(url) is not None:
            resp = requests.patch(
                url,
                headers={**K8S_HEADERS, "Content-Type": "application/merge-patch+json"},
                verify=K8S_CA,
                json={"data": data},
                timeout=15,
            )
        else:
            body = {
                "apiVersion": "v1",
                "kind": "Secret",
                "metadata": {"name": name, "namespace": NS},
                "type": "Opaque",
                "data": data,
            }
            resp = requests.post(
                f"{K8S_API}/api/v1/namespaces/{NS}/secrets",
                headers=K8S_HEADERS,
                verify=K8S_CA,
                json=body,
                timeout=15,
            )
        resp.raise_for_status()

    def k8s_apply_infisicalsecret(project_id):
        url = (
            f"{K8S_API}/apis/secrets.infisical.com/v1alpha1/namespaces/{NS}"
            "/infisicalsecrets/homepage-infisical-sync"
        )
        spec = {
            "hostAPI": API,
            "resyncInterval": RESYNC_INTERVAL,
            "authentication": {
                "universalAuth": {
                    "credentialsRef": {"secretName": "infisical-credentials", "secretNamespace": NS},
                    "secretsScope": {"projectId": project_id, "envSlug": ENV_SLUG, "secretsPath": "/"},
                }
            },
            "managedSecretReference": {
                "secretName": "homepage-api-keys",
                "secretNamespace": NS,
                "creationPolicy": "Owner",
            },
        }
        if k8s_get(url) is not None:
            resp = requests.patch(
                url,
                headers={**K8S_HEADERS, "Content-Type": "application/merge-patch+json"},
                verify=K8S_CA,
                json={"spec": spec},
                timeout=15,
            )
        else:
            body = {
                "apiVersion": "secrets.infisical.com/v1alpha1",
                "kind": "InfisicalSecret",
                "metadata": {"name": "homepage-infisical-sync", "namespace": NS},
                "spec": spec,
            }
            resp = requests.post(
                f"{K8S_API}/apis/secrets.infisical.com/v1alpha1/namespaces/{NS}/infisicalsecrets",
                headers=K8S_HEADERS,
                verify=K8S_CA,
                json=body,
                timeout=15,
            )
        resp.raise_for_status()

    existing_creds = k8s_get(f"{K8S_API}/api/v1/namespaces/{NS}/secrets/infisical-credentials")
    if existing_creds and existing_creds.get("data", {}).get("clientId"):
        print("infisical-credentials already populated, skipping provisioning.")
        sys.exit(0)

    print("Waiting for Infisical API to answer...")
    for _ in range(60):
        try:
            if requests.get(f"{API}/api/status", timeout=5).ok:
                break
        except requests.RequestException:
            pass
        time.sleep(5)
    else:
        sys.exit("Infisical API never answered")

    print("Bootstrapping Infisical admin user/org (safe to run once)...")
    resp = requests.post(
        f"{API}/api/v1/admin/bootstrap",
        json={"email": ADMIN_EMAIL, "password": ADMIN_PASSWORD, "organization": "homelab"},
        timeout=30,
    )
    if not resp.ok:
        sys.exit(f"Bootstrap failed: {resp.status_code} {resp.text}")
    boot = resp.json()
    token = boot["identity"]["credentials"]["token"]
    org_id = boot["organization"]["id"]
    auth_headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

    print("Creating project...")
    resp = requests.post(f"{API}/api/v1/projects", headers=auth_headers, json={"projectName": "homelab"}, timeout=30)
    resp.raise_for_status()
    project_id = resp.json()["project"]["id"]

    print("Creating machine identity...")
    resp = requests.post(
        f"{API}/api/v1/identities",
        headers=auth_headers,
        json={"name": "homelab-sync", "organizationId": org_id, "role": "admin"},
        timeout=30,
    )
    resp.raise_for_status()
    identity_id = resp.json()["identity"]["id"]

    print("Attaching Universal Auth...")
    resp = requests.post(
        f"{API}/api/v1/auth/universal-auth/identities/{identity_id}",
        headers=auth_headers,
        json={},
        timeout=30,
    )
    resp.raise_for_status()
    client_id = resp.json()["identityUniversalAuth"]["clientId"]

    print("Creating client secret...")
    resp = requests.post(
        f"{API}/api/v1/auth/universal-auth/identities/{identity_id}/client-secrets",
        headers=auth_headers,
        json={},
        timeout=30,
    )
    resp.raise_for_status()
    client_secret = resp.json()["clientSecret"]

    print("Granting the identity access to the project...")
    resp = requests.post(
        f"{API}/api/v1/projects/{project_id}/memberships/identities/{identity_id}",
        headers=auth_headers,
        json={"role": "admin"},
        timeout=30,
    )
    resp.raise_for_status()

    print("Writing infisical-credentials Secret...")
    k8s_apply_secret(
        "infisical-credentials",
        {"clientId": client_id, "clientSecret": client_secret, "projectId": project_id},
    )

    print("Creating InfisicalSecret sync CR for Homepage...")
    k8s_apply_infisicalsecret(project_id)

    print(f"Infisical provisioning complete. Project ID: {project_id}")
---
apiVersion: batch/v1
kind: Job
metadata:
  name: infisical-provision
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "15"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: infisical-provision
      restartPolicy: Never
      containers:
        - name: infisical-provision
          image: {{ .Values.secretSync.image }}
          command:
            - /bin/sh
            - -c
            - |
              pip install --quiet --no-cache-dir requests && \
              python /scripts/provision.py
          env:
            - name: NS
              value: {{ .Release.Namespace | quote }}
            - name: API
              value: {{ .Values.infisical.hostAPI | quote }}
            - name: ENV_SLUG
              value: {{ .Values.infisical.environmentSlug | quote }}
            - name: RESYNC_INTERVAL
              value: {{ .Values.infisical.resyncInterval | quote }}
          envFrom:
            - secretRef:
                name: infisical-bootstrap-credentials
          volumeMounts:
            - mountPath: /scripts
              name: script
      volumes:
        - name: script
          configMap:
            name: infisical-provision-script
{{- end }}
