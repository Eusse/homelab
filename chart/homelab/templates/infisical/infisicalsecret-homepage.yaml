{{- /*
When infisicalServer.enabled, the projectId doesn't exist yet at template
render time (it's created by the infisical-provision Job at install time) -
that job creates this same InfisicalSecret CR itself once it knows the real
projectId, so skip the static version here to avoid a conflicting duplicate.
*/}}
{{- if and .Values.homepage.enabled (not .Values.infisicalServer.enabled) }}
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: homepage-infisical-sync
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab.labels" (dict "name" "homepage" "Release" .Release) | nindent 4 }}
spec:
  hostAPI: {{ .Values.infisical.hostAPI }}
  resyncInterval: {{ .Values.infisical.resyncInterval }}
  authentication:
    universalAuth:
      credentialsRef:
        secretName: {{ include "homelab.infisicalSecretName" . }}
        secretNamespace: {{ .Release.Namespace }}
      secretsScope:
        projectId: {{ .Values.infisical.projectId | quote }}
        envSlug: {{ .Values.infisical.environmentSlug | quote }}
        secretsPath: "/"
  managedSecretReference:
    secretName: homepage-api-keys
    secretNamespace: {{ .Release.Namespace }}
    creationPolicy: Owner
{{- end }}
