{{- if .Values.infisicalServer.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: infisical-bootstrap-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab.labels" (dict "name" "infisical" "Release" .Release) | nindent 4 }}
type: Opaque
stringData:
  INFISICAL_ADMIN_EMAIL: {{ .Values.infisicalServerBootstrapAdmin.email | quote }}
  INFISICAL_ADMIN_PASSWORD: {{ .Values.infisicalServerBootstrapAdmin.password | quote }}
{{- end }}
