{{- if .Values.secretSync.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: secret-sync-credentials
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
type: Opaque
stringData:
  JELLYFIN_ADMIN_USER: {{ .Values.secretSync.jellyfin.adminUser | quote }}
  JELLYFIN_ADMIN_PASS: {{ .Values.secretSync.jellyfin.adminPassword | quote }}
  IMMICH_ADMIN_KEY: {{ .Values.immich.adminApiKey | quote }}
  QBIT_USER: {{ .Values.qbittorrent.credentials.username | quote }}
  QBIT_PASS: {{ .Values.qbittorrent.credentials.password | quote }}
  PIHOLE_WEBPASSWORD_HASH: {{ .Values.secretSync.pihole.webPasswordHash | quote }}
{{- end }}
