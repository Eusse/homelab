{{- if .Values.secretSync.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: secret-sync-credentials
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "20"
    # No hook-succeeded: the secret-sync Job reads this via envFrom at pod
    # start - hook-succeeded would delete it as soon as it's created,
    # racing ahead of that pod actually starting.
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  JELLYFIN_ADMIN_USER: {{ .Values.secretSync.jellyfin.adminUser | quote }}
  JELLYFIN_ADMIN_PASS: {{ .Values.secretSync.jellyfin.adminPassword | quote }}
  IMMICH_ADMIN_KEY: {{ .Values.immich.adminApiKey | quote }}
  IMMICH_ADMIN_EMAIL: {{ .Values.secretSync.immich.adminEmail | quote }}
  IMMICH_ADMIN_PASSWORD: {{ .Values.secretSync.immich.adminPassword | quote }}
  QBIT_USER: {{ .Values.qbittorrent.credentials.username | quote }}
  QBIT_PASS: {{ .Values.qbittorrent.credentials.password | quote }}
  # Pi-hole v6's Homepage widget accepts the regular admin password directly
  # as its "key" - no separate hash/app-password generation needed.
  PIHOLE_ADMIN_PASSWORD: {{ .Values.pihole.webPassword | quote }}
{{- end }}
