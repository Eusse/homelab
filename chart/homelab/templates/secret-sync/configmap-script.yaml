{{- if .Values.secretSync.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: secret-sync-script
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "20"
    # No hook-succeeded: the secret-sync Job mounts this as a volume at pod
    # start - hook-succeeded would delete it as soon as it's created,
    # racing ahead of that pod actually starting.
    helm.sh/hook-delete-policy: before-hook-creation
data:
  sync_and_wire.py: |
    import base64
    import datetime
    import os
    import re
    import sys
    import time
    import xml.etree.ElementTree as ET
    import yaml
    import requests

    INFISICAL_HOST = os.environ["INFISICAL_HOST_API"]
    PROJECT_ID = os.environ["INFISICAL_PROJECT_ID"]
    ENV_SLUG = os.environ.get("INFISICAL_ENV_SLUG", "prod")
    CLIENT_ID = os.environ["INFISICAL_CLIENT_ID"]
    CLIENT_SECRET = os.environ["INFISICAL_CLIENT_SECRET"]

    NS = os.environ["NS"]
    K8S_API = "https://kubernetes.default.svc"
    SA_DIR = "/var/run/secrets/kubernetes.io/serviceaccount"
    with open(f"{SA_DIR}/token") as f:
        K8S_TOKEN = f.read().strip()
    K8S_CA = f"{SA_DIR}/ca.crt"
    K8S_HEADERS = {"Authorization": f"Bearer {K8S_TOKEN}"}

    def k8s_restart_deployment(name):
        resp = requests.patch(
            f"{K8S_API}/apis/apps/v1/namespaces/{NS}/deployments/{name}",
            headers={**K8S_HEADERS, "Content-Type": "application/strategic-merge-patch+json"},
            verify=K8S_CA,
            json={
                "spec": {
                    "template": {
                        "metadata": {
                            "annotations": {
                                "homelab.io/restartedAt": datetime.datetime.now(datetime.timezone.utc).isoformat()
                            }
                        }
                    }
                }
            },
            timeout=15,
        )
        if resp.ok:
            print(f"{name} restart triggered.")
        else:
            print(f"[warn] failed to restart {name}: {resp.status_code} {resp.text}")
        return resp.ok

    def get_access_token():
        resp = requests.post(
            f"{INFISICAL_HOST}/api/v1/auth/universal-auth/login",
            json={"clientId": CLIENT_ID, "clientSecret": CLIENT_SECRET},
            timeout=15,
        )
        resp.raise_for_status()
        return resp.json()["accessToken"]

    def upsert_secret(token, key, value):
        if not value:
            print(f"[Infisical] Skipping {key} (no value)")
            return
        headers = {"Authorization": f"Bearer {token}"}
        body = {
            "workspaceId": PROJECT_ID,
            "environment": ENV_SLUG,
            "secretPath": "/",
            "secretValue": value,
        }
        resp = requests.post(
            f"{INFISICAL_HOST}/api/v3/secrets/raw/{key}",
            json=body,
            headers=headers,
            timeout=15,
        )
        if resp.status_code in (200, 201):
            print(f"[Infisical] Created {key}")
            return
        resp = requests.patch(
            f"{INFISICAL_HOST}/api/v3/secrets/raw/{key}",
            json=body,
            headers=headers,
            timeout=15,
        )
        if resp.ok:
            print(f"[Infisical] Updated {key}")
        else:
            print(f"[Infisical] Failed to sync {key}: {resp.status_code} {resp.text}")

    def wait_for_file(path, attempts=30, delay=2):
        for _ in range(attempts):
            if os.path.exists(path):
                return True
            time.sleep(delay)
        print(f"[warn] {path} did not appear within {attempts * delay}s")
        return False

    def get_xml_key(path):
        try:
            if not wait_for_file(path):
                return None
            return ET.parse(path).getroot().find("ApiKey").text
        except Exception as e:
            print(f"[warn] could not read {path}: {e}")
            return None

    def get_bazarr_key(path):
        try:
            if not wait_for_file(path):
                return None
            with open(path) as f:
                # Confirmed against Bazarr's own source (app/config.py):
                # `Validator('auth.apikey', ...)` is its REST API key,
                # always present (randomly generated by default) - the old
                # "analytics.apikey" path this was inherited from isn't a
                # real field, which is why it silently returned nothing.
                key = yaml.safe_load(f).get("auth", {}).get("apikey")
                if not key:
                    print(f"[warn] {path} has no auth.apikey set")
                return key
        except Exception as e:
            print(f"[warn] could not read {path}: {e}")
            return None

    def env_true(name):
        return os.environ.get(name, "false").lower() == "true"

    secrets_manifest = {}

    if env_true("SYNC_SONARR"):
        secrets_manifest["SONARR_API_KEY"] = get_xml_key("/pvc-mounts/sonarr/config.xml")

    if env_true("SYNC_PROWLARR"):
        secrets_manifest["PROWLARR_API_KEY"] = get_xml_key("/pvc-mounts/prowlarr/config.xml")

    if env_true("SYNC_BAZARR"):
        # Bazarr nests its config under a `config/` subdirectory of its data
        # dir (confirmed in its own source: config_base_file_path defaults
        # to os.path.join(args.config_dir, 'config')), unlike Sonarr/Prowlarr
        # which write config.xml directly at the root of /config.
        secrets_manifest["BAZARR_API_KEY"] = get_bazarr_key("/pvc-mounts/bazarr/config/config.yaml")

    if env_true("SYNC_QBITTORRENT"):
        secrets_manifest["QBITTORRENT_USER"] = os.environ.get("QBIT_USER", "admin")
        secrets_manifest["QBITTORRENT_PASS"] = os.environ.get("QBIT_PASS", "")

    if env_true("SYNC_PIHOLE"):
        secrets_manifest["PIHOLE_API_KEY"] = os.environ.get("PIHOLE_ADMIN_PASSWORD")

    if env_true("SYNC_JELLYFIN"):
        try:
            jellyfin_url = os.environ["JELLYFIN_URL"]
            jf_user = os.environ["JELLYFIN_ADMIN_USER"]
            jf_pass = os.environ["JELLYFIN_ADMIN_PASS"]

            print("Waiting for Jellyfin to answer...")
            info = None
            for _ in range(30):
                try:
                    resp = requests.get(f"{jellyfin_url}/System/Info/Public", timeout=5)
                    if resp.ok:
                        info = resp.json()
                        break
                except requests.RequestException:
                    pass
                time.sleep(2)
            if info is None:
                raise RuntimeError("Jellyfin never answered /System/Info/Public")

            # Jellyfin's first-run setup wizard normally requires clicking
            # through it in a browser to create the admin account - but its
            # /Startup/* endpoints are explicitly allowed unauthenticated
            # while the wizard is incomplete (confirmed in Jellyfin's own
            # StartupController source), so we can drive it directly instead.
            if not info.get("StartupWizardCompleted"):
                print("Jellyfin's setup wizard hasn't run yet - completing it via its unauthenticated first-run API...")
                resp = requests.post(
                    f"{jellyfin_url}/Startup/User",
                    json={"Name": jf_user, "Password": jf_pass},
                    timeout=15,
                )
                if not resp.ok:
                    print(f"[Jellyfin Setup Error]: /Startup/User failed with {resp.status_code} {resp.text!r}")
                resp = requests.post(f"{jellyfin_url}/Startup/Complete", timeout=15)
                if not resp.ok:
                    print(f"[Jellyfin Setup Error]: /Startup/Complete failed with {resp.status_code} {resp.text!r}")
                else:
                    print("Jellyfin admin account created and wizard completed.")

            # Jellyfin 10.12+ defaults EnableLegacyAuthorization to false,
            # which blocks the password login below (confirmed: same change
            # that broke Jellyseerr's Jellyfin integration, jellyfin#15962).
            # Fix it directly in system.xml (confirmed path and root element
            # name against Jellyfin's own source - BaseApplicationPaths and
            # ServerConfiguration) using plain text substitution rather than
            # re-serializing the whole file, so nothing else in it is
            # touched.
            system_xml = "/mnt/jellyfin-config/system.xml"
            if wait_for_file(system_xml):
                with open(system_xml) as f:
                    xml_text = f.read()
                if "<EnableLegacyAuthorization>true</EnableLegacyAuthorization>" in xml_text:
                    changed = False
                elif "<EnableLegacyAuthorization>" in xml_text:
                    xml_text = re.sub(
                        r"<EnableLegacyAuthorization>.*?</EnableLegacyAuthorization>",
                        "<EnableLegacyAuthorization>true</EnableLegacyAuthorization>",
                        xml_text,
                    )
                    changed = True
                elif "</ServerConfiguration>" in xml_text:
                    xml_text = xml_text.replace(
                        "</ServerConfiguration>",
                        "  <EnableLegacyAuthorization>true</EnableLegacyAuthorization>\n</ServerConfiguration>",
                    )
                    changed = True
                else:
                    print(f"[warn] {system_xml} doesn't look like a Jellyfin ServerConfiguration file - leaving it alone")
                    changed = False

                if changed:
                    with open(system_xml, "w") as f:
                        f.write(xml_text)
                    print("Set EnableLegacyAuthorization=true in system.xml, restarting Jellyfin...")
                    k8s_restart_deployment("jellyfin")
                    jellyfin_ready = False
                    for _ in range(30):
                        time.sleep(5)
                        try:
                            if requests.get(f"{jellyfin_url}/System/Info/Public", timeout=5).ok:
                                jellyfin_ready = True
                                break
                        except requests.RequestException:
                            pass
                    if not jellyfin_ready:
                        print("[warn] Jellyfin didn't come back up within the wait window after restart")

            auth_resp = requests.post(
                f"{jellyfin_url}/Users/AuthenticateByName",
                json={"Username": jf_user, "Pw": jf_pass},
                headers={
                    "X-Emby-Authorization": 'MediaBrowser Client="SyncScript", Device="K8s", DeviceId="1", Version="1.0"'
                },
                timeout=15,
            )
            if not auth_resp.ok:
                print(
                    f"[Jellyfin Key Gen Error]: login failed with {auth_resp.status_code} "
                    f"{auth_resp.text!r}"
                )
            else:
                token = auth_resp.json()["AccessToken"]
                key_resp = requests.post(
                    f"{jellyfin_url}/Auth/Keys?app=Homepage",
                    headers={"X-Emby-Token": token},
                    timeout=15,
                )
                if not key_resp.ok:
                    print(f"[Jellyfin Key Gen Error]: key creation failed with {key_resp.status_code} {key_resp.text!r}")
                else:
                    body = key_resp.json()
                    key = body.get("AccessToken")
                    if not key:
                        print(f"[Jellyfin Key Gen Error]: no 'AccessToken' field in response: {body!r}")
                    secrets_manifest["JELLYFIN_API_KEY"] = key
        except Exception as e:
            print(f"[Jellyfin Key Gen Error]: {e}")

    if env_true("SYNC_IMMICH"):
        try:
            immich_url = os.environ["IMMICH_URL"]
            admin_api_key = os.environ.get("IMMICH_ADMIN_KEY", "")
            immich_email = os.environ.get("IMMICH_ADMIN_EMAIL", "")
            immich_password = os.environ.get("IMMICH_ADMIN_PASSWORD", "")

            def create_immich_key(auth_headers):
                # Confirmed against Immich's own source (api-key.controller.ts
                # + api-key.dto.ts): the endpoint is /api-keys (plural, not
                # the old /api-key this was inherited pointing at), and
                # `permissions` is a required field - "all" mirrors what a
                # manually-created key gets with every box ticked.
                resp = requests.post(
                    f"{immich_url}/api/api-keys",
                    headers=auth_headers,
                    json={"name": "Homepage Dashboard Key", "permissions": ["all"]},
                    timeout=15,
                )
                if not resp.ok:
                    print(f"[Immich Key Gen Error]: {resp.status_code} {resp.text!r}")
                    return None
                body = resp.json()
                secret = body.get("secret")
                if not secret:
                    print(f"[Immich Key Gen Error]: no 'secret' field in response: {body!r}")
                return secret

            if admin_api_key:
                # Manual path: authenticate with a key you generated by hand.
                secrets_manifest["IMMICH_API_KEY"] = create_immich_key({"x-api-key": admin_api_key})
            elif immich_email and immich_password:
                # Full automation, mirroring Jellyfin's: /auth/admin-sign-up
                # is only usable once, before any admin exists (confirmed in
                # Immich's own AuthGuard - it calls requireSetupAvailable()
                # and rejects the route once setup is done), so a failure
                # here just means an admin already exists - fall through to
                # logging in with the same credentials either way.
                resp = requests.post(
                    f"{immich_url}/api/auth/admin-sign-up",
                    json={"email": immich_email, "password": immich_password, "name": "Homelab Admin"},
                    timeout=15,
                )
                if resp.ok:
                    print("Immich admin account created.")
                else:
                    print(f"[Immich Setup] admin-sign-up skipped ({resp.status_code}) - assuming an admin already exists")

                resp = requests.post(
                    f"{immich_url}/api/auth/login",
                    json={"email": immich_email, "password": immich_password},
                    timeout=15,
                )
                if not resp.ok:
                    print(f"[Immich Key Gen Error]: login failed with {resp.status_code} {resp.text!r}")
                else:
                    access_token = resp.json()["accessToken"]
                    secrets_manifest["IMMICH_API_KEY"] = create_immich_key(
                        {"Authorization": f"Bearer {access_token}"}
                    )
            else:
                print(
                    "[Immich Key Gen Error]: set either immich.adminApiKey or "
                    "secretSync.immich.adminEmail/adminPassword"
                )
        except Exception as e:
            print(f"[Immich Key Gen Error]: {e}")

    token = get_access_token()
    pushed = {k: v for k, v in secrets_manifest.items() if v}
    for k, v in pushed.items():
        upsert_secret(token, k, v)

    print("Secret sync complete.")

    # Homepage reads its API keys once, from envFrom, at container start -
    # which always happens before this job runs (let alone before the
    # Infisical Operator's own async resync picks up what was just pushed
    # above). So every install/upgrade needs an explicit restart afterwards
    # for the dashboard widgets to actually pick up fresh keys.
    if env_true("RESTART_HOMEPAGE") and pushed:
        def get_homepage_secret_data():
            resp = requests.get(
                f"{K8S_API}/api/v1/namespaces/{NS}/secrets/homepage-api-keys",
                headers=K8S_HEADERS,
                verify=K8S_CA,
                timeout=15,
            )
            if resp.status_code == 404:
                return {}
            resp.raise_for_status()
            data = resp.json().get("data", {})
            return {k: base64.b64decode(v).decode(errors="replace") for k, v in data.items()}

        print("Waiting for the Infisical Operator to sync homepage-api-keys...")
        synced = False
        for _ in range(24):  # up to ~2 minutes
            current = get_homepage_secret_data()
            if all(current.get(k) == v for k, v in pushed.items()):
                synced = True
                break
            time.sleep(5)

        if synced:
            print("homepage-api-keys is up to date.")
        else:
            print(
                "[warn] homepage-api-keys didn't catch up in time - restarting "
                "Homepage anyway, but it may still need another restart once "
                "the Operator's next resync lands."
            )

        print("Restarting Homepage to pick up fresh keys...")
        k8s_restart_deployment("homepage")
{{- end }}
