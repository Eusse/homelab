{{- if .Values.secretSync.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-sync
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "24"
    # No hook-succeeded: see the note on qbittorrent-webui-fix's ServiceAccount
    # - it would delete this before the Job pod below can mount its token.
    helm.sh/hook-delete-policy: before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-sync
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "24"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["homepage-api-keys"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["homepage", "jellyfin"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-sync
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "24"
    helm.sh/hook-delete-policy: before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-sync
subjects:
  - kind: ServiceAccount
    name: secret-sync
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: secret-sync
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "25"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: secret-sync
      restartPolicy: Never
      containers:
        - name: secret-sync
          image: {{ .Values.secretSync.image }}
          command:
            - /bin/sh
            - -c
            - |
              pip install --quiet --no-cache-dir requests pyyaml && \
              python /scripts/sync_and_wire.py
          env:
            - name: NS
              value: {{ .Release.Namespace | quote }}
            - name: RESTART_HOMEPAGE
              value: {{ .Values.homepage.enabled | quote }}
            - name: INFISICAL_HOST_API
              value: {{ .Values.infisical.hostAPI | quote }}
            - name: INFISICAL_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "homelab.infisicalSecretName" . }}
                  key: projectId
            - name: INFISICAL_ENV_SLUG
              value: {{ .Values.infisical.environmentSlug | quote }}
            - name: INFISICAL_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "homelab.infisicalSecretName" . }}
                  key: clientId
            - name: INFISICAL_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "homelab.infisicalSecretName" . }}
                  key: clientSecret
            - name: SYNC_SONARR
              value: {{ .Values.sonarr.enabled | quote }}
            - name: SYNC_PROWLARR
              value: {{ .Values.prowlarr.enabled | quote }}
            - name: SYNC_BAZARR
              value: {{ .Values.bazarr.enabled | quote }}
            - name: SYNC_QBITTORRENT
              value: {{ .Values.qbittorrent.enabled | quote }}
            - name: SYNC_PIHOLE
              value: {{ .Values.pihole.enabled | quote }}
            - name: SYNC_JELLYFIN
              value: {{ .Values.jellyfin.enabled | quote }}
            - name: SYNC_IMMICH
              value: {{ .Values.immich.enabled | quote }}
            - name: SYNC_JELLYSEERR
              value: {{ and .Values.jellyseerr.enabled .Values.jellyfin.enabled | quote }}
            - name: JELLYFIN_URL
              value: "http://jellyfin-service.{{ .Release.Namespace }}.svc.cluster.local:8096"
            - name: JELLYFIN_HOSTNAME
              value: "jellyfin-service.{{ .Release.Namespace }}.svc.cluster.local"
            - name: JELLYFIN_PORT
              value: "8096"
            - name: IMMICH_URL
              value: "http://immich-service.{{ .Release.Namespace }}.svc.cluster.local:2283"
            - name: JELLYSEERR_URL
              value: "http://jellyseerr.{{ .Release.Namespace }}.svc.cluster.local:5055"
          envFrom:
            - secretRef:
                name: secret-sync-credentials
          volumeMounts:
            - mountPath: /scripts
              name: script
            {{- if .Values.sonarr.enabled }}
            - mountPath: /pvc-mounts/sonarr
              name: sonarr-config
              readOnly: true
            {{- end }}
            {{- if .Values.prowlarr.enabled }}
            - mountPath: /pvc-mounts/prowlarr
              name: prowlarr-config
              readOnly: true
            {{- end }}
            {{- if .Values.bazarr.enabled }}
            - mountPath: /pvc-mounts/bazarr
              name: bazarr-config
              readOnly: true
            {{- end }}
            {{- if .Values.jellyfin.enabled }}
            - mountPath: /mnt/jellyfin-config
              name: jellyfin-config
              # Read-write: this job edits system.xml directly to enable
              # legacy authorization (see the script) - see values.yaml for
              # why nothing short of that works with recent Jellyfin.
            {{- end }}
      volumes:
        - name: script
          configMap:
            name: secret-sync-script
        {{- if .Values.sonarr.enabled }}
        - name: sonarr-config
          persistentVolumeClaim:
            claimName: sonarr-config-pvc
        {{- end }}
        {{- if .Values.prowlarr.enabled }}
        - name: prowlarr-config
          persistentVolumeClaim:
            claimName: prowlarr-config-pvc
        {{- end }}
        {{- if .Values.bazarr.enabled }}
        - name: bazarr-config
          persistentVolumeClaim:
            claimName: bazarr-config-pvc
        {{- end }}
        {{- if .Values.jellyfin.enabled }}
        - name: jellyfin-config
          hostPath:
            path: {{ .Values.jellyfin.storage.configPath }}
            type: Directory
        {{- end }}
{{- end }}
