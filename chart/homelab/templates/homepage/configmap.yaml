{{- if .Values.homepage.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab.labels" (dict "name" "homepage" "Release" .Release) | nindent 4 }}
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: ""
  custom.css: ""
  custom.js: ""
  docker.yaml: ""
  proxmox.yaml: ""
  bookmarks.yaml: |
    {{- .Values.homepage.bookmarks | nindent 4 }}
  services.yaml: |
    {{- $ns := .Release.Namespace }}
    {{- $lanHost := .Values.global.lanHost }}
    {{- if or .Values.jellyfin.enabled .Values.immich.enabled .Values.jellyseerr.enabled }}
    - Media & Streaming:
        {{- if .Values.jellyfin.enabled }}
        - Jellyfin:
            icon: jellyfin.png
            href: http://{{ $lanHost }}:{{ .Values.jellyfin.service.nodePort }}/
            description: Media Server
            widget:
              type: jellyfin
              url: http://jellyfin-service.{{ $ns }}.svc.cluster.local:8096
              key: "{{ "{{HOMEPAGE_VAR_JELLYFIN_API_KEY}}" }}"
        {{- end }}
        {{- if .Values.immich.enabled }}
        - Immich:
            icon: immich.png
            href: http://{{ $lanHost }}:{{ .Values.immich.service.nodePort }}/
            description: Photo & Video Backup
            widget:
              type: immich
              url: http://immich-service.{{ $ns }}.svc.cluster.local:2283
              key: "{{ "{{HOMEPAGE_VAR_IMMICH_API_KEY}}" }}"
              version: 2
        {{- end }}
        {{- if .Values.jellyseerr.enabled }}
        - Jellyseerr:
            icon: jellyseerr.png
            href: http://{{ $lanHost }}:{{ .Values.jellyseerr.service.nodePort }}/
            description: Media Request Management
        {{- end }}
    {{- end }}

    {{- if or .Values.sonarr.enabled .Values.bazarr.enabled .Values.prowlarr.enabled .Values.qbittorrent.enabled }}
    - Automation & Downloads:
        {{- if .Values.sonarr.enabled }}
        - Sonarr:
            icon: sonarr.png
            href: http://{{ $lanHost }}:{{ .Values.sonarr.service.nodePort }}/
            description: TV Series Management
            widget:
              type: sonarr
              url: http://sonarr.{{ $ns }}.svc.cluster.local:8989
              key: "{{ "{{HOMEPAGE_VAR_SONARR_API_KEY}}" }}"
        {{- end }}
        {{- if .Values.bazarr.enabled }}
        - Bazarr:
            icon: bazarr.png
            href: http://{{ $lanHost }}:{{ .Values.bazarr.service.nodePort }}/
            description: Subtitle Manager
            widget:
              type: bazarr
              url: http://bazarr-service.{{ $ns }}.svc.cluster.local:6767
              key: "{{ "{{HOMEPAGE_VAR_BAZARR_API_KEY}}" }}"
        {{- end }}
        {{- if .Values.prowlarr.enabled }}
        - Prowlarr:
            icon: prowlarr.png
            href: http://{{ $lanHost }}:{{ .Values.prowlarr.service.nodePort }}/
            description: Indexer Manager
            widget:
              type: prowlarr
              url: http://prowlarr.{{ $ns }}.svc.cluster.local:9696
              key: "{{ "{{HOMEPAGE_VAR_PROWLARR_API_KEY}}" }}"
        {{- end }}
        {{- if .Values.qbittorrent.enabled }}
        - qBittorrent:
            icon: qbittorrent.png
            href: http://{{ $lanHost }}:{{ .Values.qbittorrent.service.webuiNodePort }}/
            description: Torrent Client
            widget:
              type: qbittorrent
              url: http://qbittorrent.{{ $ns }}.svc.cluster.local:{{ .Values.qbittorrent.service.webuiNodePort }}
              username: "{{ "{{HOMEPAGE_VAR_QBITTORRENT_USER}}" }}"
              password: "{{ "{{HOMEPAGE_VAR_QBITTORRENT_PASS}}" }}"
        {{- end }}
    {{- end }}

    - Management & Infrastructure:
        - Infisical:
            icon: infisical.png
            href: http://{{ $lanHost }}:8080/
            description: Secret & Identity Management
        {{- if .Values.pihole.enabled }}
        - Pi-hole:
            icon: pi-hole.png
            href: http://{{ $lanHost }}:{{ .Values.pihole.webPort }}/admin/
            description: Network-wide Ad Blocking
            widget:
              type: pihole
              url: http://pihole-web.{{ $ns }}.svc.cluster.local:{{ .Values.pihole.webPort }}
              key: "{{ "{{HOMEPAGE_VAR_PIHOLE_API_KEY}}" }}"
        {{- end }}
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        network: default
    - search:
        provider: duckduckgo
        target: _blank
{{- end }}
