{{- if .Values.sonarr.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab.labels" (dict "name" "sonarr" "Release" .Release) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sonarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sonarr
    spec:
      containers:
        - name: sonarr
          image: {{ .Values.sonarr.image }}
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: {{ .Values.global.timezone | quote }}
          ports:
            - containerPort: 8989
              name: http
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /tv
              name: media-tv
            - mountPath: /downloads
              name: media-downloads
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sonarr-config-pvc
        - name: media-tv
          hostPath:
            path: {{ .Values.sonarr.storage.tvPath }}
            type: DirectoryOrCreate
        - name: media-downloads
          hostPath:
            path: {{ .Values.sonarr.storage.downloadsPath }}
            type: DirectoryOrCreate
{{- end }}
