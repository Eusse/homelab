{{- if .Values.immich.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-redis
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-redis
  template:
    metadata:
      labels:
        app: immich-redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.immich.images.redis }}
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: immich-redis
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: immich-redis
  ports:
    - port: 6379
      targetPort: 6379
{{- end }}
