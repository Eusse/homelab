{{- if .Values.immich.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-machine-learning
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-machine-learning
  template:
    metadata:
      labels:
        app: immich-machine-learning
    spec:
      containers:
        - name: machine-learning
          image: {{ .Values.immich.images.machineLearning }}
          env:
            - name: NODE_ENV
              value: "production"
          ports:
            - containerPort: 3003
---
apiVersion: v1
kind: Service
metadata:
  name: immich-machine-learning
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: immich-machine-learning
  ports:
    - port: 3003
      targetPort: 3003
{{- end }}
