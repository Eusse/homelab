# Default values for the homelab chart.
# Install into a dedicated namespace, e.g.:
#   helm install homelab ./chart/homelab -n homelab --create-namespace
#
# Anything that looks like a credential below is a placeholder. Override it with
# a separate, untracked values file (e.g. -f secrets.values.yaml) rather than
# editing this file or committing real secrets.

global:
  # Public hostname used by Homepage's Ingress.
  domain: pulguitos.network
  # LAN hostname (e.g. resolved by Pi-hole/local DNS) used to build the
  # clickable NodePort links shown on the Homepage dashboard.
  lanHost: homelab.local
  nodeIP: 192.168.78.166
  timezone: America/Bogota
  ingressClassName: public
  # When enabled, every app also gets an Ingress at <app>.<baseDomain>
  # (e.g. immich.homelab) instead of only being reachable via NodePort.
  # This only works once something resolves "*.<baseDomain>" to nodeIP for
  # your LAN clients - see README.md's "LAN hostnames" section.
  lanIngress:
    enabled: true
    baseDomain: homelab

# --- Infisical Kubernetes Operator (installed as a chart dependency) ---
infisicalOperator:
  enabled: true

# --- Infisical project this cluster syncs secrets from/to ---
infisical:
  hostAPI: http://infisical-standalone-postgres.default.svc.cluster.local:8080
  projectId: ""
  environmentSlug: prod
  resyncInterval: 60
  # Name of an existing Secret with keys `clientId`/`clientSecret` (Infisical
  # Universal/Machine Identity auth). Leave empty to have the chart create one
  # from infisical.clientId/clientSecret below.
  existingCredentialsSecret: ""
  clientId: ""
  clientSecret: ""

# --- Homepage dashboard ---
homepage:
  enabled: true
  image:
    repository: ghcr.io/gethomepage/homepage
    tag: latest
  service:
    nodePort: 30000
  ingress:
    enabled: true
  # Extra raw bookmarks.yaml content, appended as-is under the ConfigMap.
  bookmarks: |
    - Developer:
        - Github:
            - abbr: GH
              href: https://github.com/

jellyfin:
  enabled: true
  image: jellyfin/jellyfin:latest
  service:
    nodePort: 32096
  storage:
    configPath: /srv/jellyfin/config
    tvPath: /srv/media/tv
    moviesPath: /srv/media/movies

sonarr:
  enabled: true
  image: lscr.io/linuxserver/sonarr:latest
  service:
    nodePort: 30089
  storage:
    configSize: 2Gi
    tvPath: /srv/media/tv
    downloadsPath: /srv/media/downloads

prowlarr:
  enabled: true
  image: lscr.io/linuxserver/prowlarr:latest
  service:
    nodePort: 30096
  storage:
    configSize: 1Gi

bazarr:
  enabled: true
  image: lscr.io/linuxserver/bazarr:latest
  service:
    nodePort: 30767
  storage:
    configSize: 1Gi
    tvPath: /srv/media/tv

qbittorrent:
  enabled: true
  image: lscr.io/linuxserver/qbittorrent:latest
  # Replicates the WebUI Host Header Validation bypass the old install.sh
  # applied by hand: a post-install/upgrade Job patches qBittorrent.conf.
  webuiFix:
    enabled: true
  service:
    webuiNodePort: 30081
    torrentNodePort: 30681
  storage:
    configSize: 2Gi
    downloadsPath: /srv/media/downloads
  credentials:
    username: admin
    password: adminadmin

pihole:
  enabled: true
  image: pihole/pihole:latest
  timezone: America/New_York
  webPassword: admin
  # pihole runs with hostNetwork, so it's reached directly on the node at
  # this port rather than through a ClusterIP Service.
  webPort: 8080
  storage:
    configPath: /srv/pihole/data

immich:
  enabled: true
  images:
    redis: valkey/valkey:8-alpine
    postgres: ghcr.io/immich-app/postgres:16-vectorchord0.3.0-pgvectors0.3.0
    machineLearning: ghcr.io/immich-app/immich-machine-learning:release
    server: ghcr.io/immich-app/immich-server:release
  service:
    nodePort: 32283
  storage:
    uploadPath: /srv/immich/upload
    postgresPath: /srv/immich/postgres
  postgres:
    user: postgres
    password: immichpass
    db: immich
  # Admin API key created manually once via the Immich UI/CLI after first
  # login; used by secretSync to mint a scoped key for Homepage.
  adminApiKey: ""

jellyseerr:
  enabled: true
  image: fallenbagel/jellyseerr:latest
  service:
    nodePort: 30055
  storage:
    configSize: 2Gi

flaresolverr:
  enabled: true
  image: ghcr.io/flaresolverr/flaresolverr:latest

# --- Secret sync job: pulls/generates each app's API key and pushes it to
# Infisical, from where the Infisical Operator syncs it back into the
# `homepage-api-keys` Secret that Homepage's widgets read from. ---
secretSync:
  enabled: true
  image: python:3.12-slim
  jellyfin:
    adminUser: ""
    adminPassword: ""
  pihole:
    webPasswordHash: ""
